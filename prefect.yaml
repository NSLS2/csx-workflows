name: prefect-docker-pixi-tiled-csx
prefect-version: 3.6.10

build: null

push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /repo
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/nsls2/nsls2-workflows-template.git
      branch: main

deployments:
  - name: csx-end-of-run-workflow-docker
    version: 0.1.2
    tags:
      - csx
      - main
    description: Deploy the updated Docker image
    entrypoint: end_of_run_workflow.py:end_of_run_workflow
    parameters: {}
    schedule: {}
    work_pool:
      job_variables:
        image: ghcr.io/nsls2/nsls2-workflows-template:main
        image_pull_policy: Always
        network: slirp4netns
        volumes:
          - /nsls2/data/csx/proposals:/nsls2/data/csx/proposals
          - /srv/prefect3-docker-worker-csx/app:/srv
        container_create_kwargs:
          userns_mode: "keep-id:uid=402969,gid=402969" # workflow-csx:workflow-csx
        auto_remove: true
      name: csx-work-pool-docker
